name: Shared dependency repair guard
on:
  pull_request:
    paths:
      - 'scripts/shared_repair_guard.py'
      - 'scripts/dependency_checkpoint.py'
      - 'tests/shared_repair_guard.py'
      - '.github/workflows/shared-repair-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install packaging==25.0 requests==2.32.5 cryptography==46.0.7 http-message-signatures==1.0.1 http-sfv==0.9.9
      - run: python tests/shared_repair_guard.py
