name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.23.3', '24.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 scripts/build_review.py
      - run: npm run lint
        working-directory: frontend
      - run: node tests/service_worker.mjs
  python-syntax:
    # Python3.12/3.14.2 artifacts exist for24.04; ubuntu-latest moved to26.04.
    # Keep the target runtime pins instead of silently testing another Python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q tele_tena scripts tests
      - run: python tests/dependency_checkpoint.py
      - run: python -m unittest tests.release_backup tests.frappe_lock
